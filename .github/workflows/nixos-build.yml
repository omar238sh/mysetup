name: Build NixOS and Push to Cachix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Name of the system in flake.nix -> nixosConfigurations.<HOST>
env:
  HOST_NAME: omar
  CACHIX_CACHE_NAME: omar238sh  # change this to your cache name on cachix.org

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Log in to Cachix (also used as a substituter during build)
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build the full NixOS system
        run: |
          nix build \
            ".#nixosConfigurations.${HOST_NAME}.config.system.build.toplevel" \
            --print-build-logs \
            --out-link ./result

      - name: Show resulting nix store path
        id: store_path
        run: |
          STORE_PATH=$(readlink -f ./result)
          echo "path=$STORE_PATH" >> "$GITHUB_OUTPUT"
          echo "Built: $STORE_PATH"

      - name: Push full closure to Cachix with zstd compression level 22
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          # Compute every nix store path the system depends on (full closure)
          nix-store -qR ./result > closure.txt
          echo "Number of paths to push: $(wc -l < closure.txt)"

          # Push with the highest zstd compression level (22)
          cachix push "${CACHIX_CACHE_NAME}" \
            --compression-method zstd \
            --compression-level 16 \
            $(cat closure.txt)

      - name: (Optional) Pin the current path as the only "latest" one
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          # This prevents Cachix's own GC from deleting this specific path
          # as long as it stays pinned. Any previous pin must be replaced
          # manually or via the Cachix web UI / API.
          cachix pin "${CACHIX_CACHE_NAME}" latest-system "${{ steps.store_path.outputs.path }}"

      - name: Clean up local store (keep only what's currently needed)
        run: |
          nix-collect-garbage -d
